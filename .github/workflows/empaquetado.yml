name: Empaquetado

on:
  push:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar PyInstaller
        run: pip install pyinstaller
      - name: Generar ejecutable
        run: pyinstaller --onefile comprova_desplegaments.py
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: comprova-linux
          path: dist/comprova_desplegaments

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar PyInstaller
        run: pip install pyinstaller
      - name: Generar ejecutable
        run: pyinstaller --onefile comprova_desplegaments.py
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: comprova-macos
          path: dist/comprova_desplegaments


  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar PyInstaller
        run: pip install pyinstaller
      - name: Generar ejecutable
        run: pyinstaller --onefile comprova_desplegaments.py
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: comprova-windows
          path: dist/comprova_desplegaments.exe

  test-ejecutables:
    needs: [build-linux, build-macos, build-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artefacto: comprova-linux
            fichero: comprova_desplegaments
          - os: macos-latest
            artefacto: comprova-linux
            fichero: comprova_desplegaments
          - os: windows-latest
            artefecto: comproba-windows
            fichero: comprova_desplegaments.exe
      runs-on: ${{matrix.os}}
      defaults:
      	run:
	  shell: bash
      steps:
        - name: Descargar ejecutable
          uses: actions/download-artifact@v4
          with:
            name: ${{ matrix.artefacto }}
            path: bin
        - name: Dar permisos de ejecución
          if: runner.os != 'Windows'
          run: chmod +x bin/${{ matrix.fichero }}
        - name: Ejecutar sin parámetros (debe fallar pidiendo una URL)
          run: |
            if ./bin/${{ matrix.fichero }}; then
              echo "Se esperaba un error al no indicar URL"; exit 1
            fi
        - name: Ejecutar contra una URL real
          run: ./bin/${{ matrix.fichero }} example.com
      
